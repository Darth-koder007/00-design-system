name: Update visual regression baselines

# Manually triggered utility: regenerates the Storybook visual-regression PNGs using this exact
# CI environment (same ubuntu-latest + playwright install --with-deps chromium as the `visual`
# job in ci.yml), then commits them directly. Baselines generated on a developer's own machine
# (even inside a matched Docker image) don't reliably match CI's font/rendering setup closely
# enough for a 0.1% pixel-diff threshold — generating them from CI itself removes that variable
# entirely. Run this whenever a real component change legitimately changes rendered output.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ds/tokens run build
      - run: pnpm --filter @ds/components run build
      - run: pnpm --filter @ds/storybook exec playwright install --with-deps chromium
      - run: pnpm --filter @ds/storybook run test:visual:update

      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/storybook/__snapshots__
          git diff --cached --quiet && echo "No baseline changes." || git commit -m "Update visual regression baselines (generated in CI)"
          git push
