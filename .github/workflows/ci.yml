name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ds/tokens run build
      - run: pnpm --filter @ds/components run build
      - run: pnpm --filter @ds/storybook exec playwright install --with-deps chromium
      - run: pnpm --filter @ds/storybook run test:visual

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-output
          path: apps/storybook/__snapshots__/__diff_output__
